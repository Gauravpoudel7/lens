app = "lens"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[processes]
  web = "sh scripts/docker-entry.sh"
  worker = "sh -c 'LENS_ROLE=worker sh scripts/docker-entry.sh'"

[http_service]
  internal_port = 3847
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  processes = ["web"]

  [[http_service.checks]]
    grace_period = "40s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
